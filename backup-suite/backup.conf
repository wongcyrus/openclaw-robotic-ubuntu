# OpenClaw Backup Configuration File
# Save this file alongside backup.sh as 'backup.conf'

# 1. Source and Destination Paths
# The primary OpenClaw home directory
OPENCLAW_DIR="/home/developer/.openclaw"

# The target directory where backup archives will be stored
BACKUP_DIR="/home/developer/openclaw-backup-archives"

# 2. Retention Settings
# Number of days to keep local backup archives. Stale archives will be auto-pruned.
RETENTION_DAYS=14

# 3. Compression Type
# Supported: gzip (tar.gz), bzip2 (tar.bz2), xz (tar.xz)
COMPRESSION_TYPE="gzip"

# 4. Strict Security Permissions
# If set to true, archives and configuration files will have chmod 600 (owner read-write only)
STRICT_PERMISSIONS=true

# 5. Backup Exclusion Patterns
# Files or directories matching these patterns will be excluded from the archive.
# Do not back up databases (*.sqlite), transaction journals, logs, or daily diaries (memory directories).
EXCLUDES=(
  "*.sqlite"
  "*.sqlite-shm"
  "*.sqlite-wal"
  "*/memory/*"
  "logs/*"
  "subagents/*"
  "update-check.json"
  "gateway-supervisor-restart-handoff.json"
  "exec-approvals.json"
)

# 6. Encryption Settings (Optional)
# Set to "true" to encrypt the backup tarball using GPG symmetric encryption.
# If enabled, you must provide a passphrase or run interactively.
ENCRYPT_BACKUPS=false
GPG_PASSPHRASE=""  # Leave blank for interactive prompt, or set a secure password if automating
